name: scrum-pro
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  public-app:
    <<: *common
    image: scrum-pro@sha256:2c635eed966411b4497eb5915ada5bbcd7cbc8c4c8fb860a07e41dd5dbf8b549
    pull_policy: never
    platform: linux/amd64
    env_file: ./app.env
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/parley", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  db:
    <<: *common
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=32"]
    environment:
      POSTGRES_USER: parley
      POSTGRES_DB: parley
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["parley-data:/var/lib/postgresql/data"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parley -d parley"]
      interval: 5s
      timeout: 3s
      retries: 10
  public-gateway:
    <<: *common
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    mem_limit: 48m
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
      GOMEMLIMIT: 32MiB
    user: "65532:65532"
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      public-app: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  cloudflared:
    <<: *common
    image: cloudflare/cloudflared@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    mem_limit: 64m
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?required}
      GOMEMLIMIT: 48MiB
    read_only: true
    cap_drop: [ALL]
    depends_on:
      public-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  parley-data:
