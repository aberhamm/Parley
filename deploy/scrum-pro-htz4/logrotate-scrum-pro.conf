# Invoked only by privacy-host.py with its private --state file. Do not install
# into /etc/logrotate.d or include the shared host logrotate configuration.
/var/log/scrum-pro/scrum-pro-????-??-??.jsonl {
    daily
    maxsize 10M
    rotate 3
    copytruncate
    extension .jsonl
    nocompress
    missingok
    notifempty
    su root root
    create 0600 root root
}
