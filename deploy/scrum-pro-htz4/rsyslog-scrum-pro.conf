# Dedicated instance only. Never include the host's /etc/rsyslog.conf or
# rsyslog.d. SysSock.Use=off leaves the shared system socket untouched.
# Syntax references: https://docs.rsyslog.com/doc/configuration/modules/imuxsock.html
# https://docs.rsyslog.com/doc/reference/templates/templates-statement-property.html
module(load="imuxsock" SysSock.Use="off")
global(workDirectory="/var/lib/scrum-pro-logging" maxMessageSize="16k")
# Keep no on-disk queue. The input admits at most 200 messages per five-second
# rate-limit bucket, across severities; bursts beyond it can drop diagnostics.
# maxsize rotation runs every minute, so 10 MiB is a threshold, not an exact
# instantaneous file-size ceiling. Docker's separate 1 MiB nonblocking buffer
# must be configured with cache-disabled=true on all four Scrum services.
main_queue(queue.type="Direct")
input(type="imuxsock" Socket="/run/scrum-pro-logging/syslog.sock"
      # Docker emits RFC5424micro. The optimized local-syslog parser mistakes
      # its version field for a program tag; use the standard RFC5424 parser.
      UseSpecialParser="off" ParseHostname="on"
      CreatePath="on" RateLimit.Interval="5" RateLimit.Burst="200" RateLimit.Severity="0")

template(name="ScrumDailyFile" type="list") {
    constant(value="/var/log/scrum-pro/scrum-pro-")
    property(name="timegenerated" dateFormat="year" date.inUTC="on")
    constant(value="-")
    property(name="timegenerated" dateFormat="month" date.inUTC="on")
    constant(value="-")
    property(name="timegenerated" dateFormat="day" date.inUTC="on")
    constant(value=".jsonl")
}
template(name="ScrumJSONLine" type="list") {
    constant(value="{\"timestamp\":\"")
    property(name="timegenerated" dateFormat="rfc3339" date.inUTC="on")
    constant(value="\",\"tag\":\"")
    property(name="syslogtag" format="json")
    constant(value="\",\"message\":\"")
    property(name="msg" format="json")
    constant(value="\"}\n")
}

# Compose tag must be {{.Name}}. Accept only the four Scrum services,
# optionally carrying Docker Compose's numeric replica suffix. RFC5424 puts
# this identity in APP-NAME; programname may be empty on this input.
if re_match($app-name, "^scrum-pro-(public-app|db|public-gateway|cloudflared)(-[0-9]+)?\$") then {
    action(type="omfile" dynaFile="ScrumDailyFile" template="ScrumJSONLine"
           fileCreateMode="0600" dirCreateMode="0700" createDirs="on"
           dynaFileCacheSize="2" flushOnTXEnd="on")
    stop
}
# Unrecognized input is discarded; no forwarding to shared rsyslog/journald.
stop
